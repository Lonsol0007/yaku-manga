[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaku-translate"
version = "0.0.3"
description = "Yaku Manga's on-device manga translation pipeline, as a Python package and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["manga", "translation", "onnx", "ocr", "typesetting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "onnx>=1.15",
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
yaku-translate = "yaku_translate.cli:main"

[project.urls]
Homepage = "https://github.com/Lonsol0007/yaku-manga"
Source = "https://github.com/Lonsol0007/yaku-manga/tree/main/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # the formatter owns line length
    "B008",    # a default built by a call is fine for the frozen style dataclasses
    "SIM108",  # a ternary is not always clearer than the if it replaces
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
